server {
    listen 80;
    listen 443 ssl;  # keep your existing ssl_certificate lines
    server_name wiki.nukeviet.vn;

    location = /doku.php {
        if ($nv_new_by_id) { return 301 https://docs.nukeviet.vn$nv_new_by_id; }
        return 301 https://docs.nukeviet.vn/;
    }
    location = /lib/exe/fetch.php {
        if ($nv_new_fetch) { return 301 https://docs.nukeviet.vn$nv_new_fetch; }
        return 301 https://docs.nukeviet.vn/;
    }
    location / {
        if ($nv_new_media) { return 301 https://docs.nukeviet.vn$nv_new_media; }
        if ($nv_new_path) { return 301 https://docs.nukeviet.vn$nv_new_path; }
        return 301 https://docs.nukeviet.vn/;
    }
}
